# Release kit configuration (see openshare DEVELOPMENT.md "Release workflow"
# for the full model). Root-package layout: one manifest at the repo root;
# main is the stable channel, dev stacks -dev.N build stamps per push.

MANIFESTS="package.json"
STABLE_BRANCHES="main"
MAX_BUMP="minor"
RELEASE_GATE="off"
PROTECTED_BRANCHES="main,master"

# Path filters (globs, repo-root-relative) - must equal the workflow's
# paths: trigger block (kit-check enforces the sync). NPM_GATE=off: this
# repo publishes one package containing everything, so every release
# publishes.
RELEASE_PATHS="src/** scripts/** README.md LICENSE package.json package-lock.json tsconfig*.json"
NPM_PATHS="src/** scripts/** README.md LICENSE package.json package-lock.json tsconfig*.json"
NPM_GATE="off"
# single-package repo: every file maps to one part in release notes
KIT_DEFAULT_PART="package"
